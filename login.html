<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login & SSO | DataForge Labs</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dfBg: '#040816',
                        dfSecondaryBg: '#0A1022',
                        dfCard: 'rgba(255, 255, 255, 0.03)',
                        dfPrimary: '#00E676',
                        dfSecondary: '#00B8FF',
                        dfAccent: '#7C4DFF',
                        dfHighlight: '#00FFD1',
                        dfText: '#FFFFFF',
                        dfMuted: '#B7C3D7',
                        dfBorder: 'rgba(255, 255, 255, 0.08)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    keyframes: {
                        aurora: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        }
                    },
                    animation: {
                        aurora: 'aurora 15s ease infinite alternate',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #040816;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            border-color: rgba(0, 230, 118, 0.4);
            box-shadow: 0 0 35px rgba(0, 230, 118, 0.15);
        }

        .aurora-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            filter: blur(140px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.35;
            animation: aurora 12s infinite alternate;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #040816;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .grid-overlay {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
    </style>
</head>
<body class="custom-scrollbar grid-overlay min-h-screen flex items-center justify-center p-6">

    <div class="aurora-bg bg-dfPrimary top-10 left-10"></div>
    <div class="aurora-bg bg-dfAccent bottom-10 right-10"></div>

    <div class="max-w-md w-full space-y-8 z-10 py-8">
        
        <!-- Brand Logo Header -->
        <div class="text-center space-y-3">
            <a href="index.html" class="inline-flex items-center gap-3 group">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-dfPrimary to-dfSecondary p-[1px] flex items-center justify-center">
                    <div class="w-full h-full bg-dfBg rounded-2xl flex items-center justify-center">
                        <i data-lucide="shield-check" class="w-6 h-6 text-dfPrimary"></i>
                    </div>
                </div>
            </a>
            <h1 class="font-display text-2xl sm:text-3xl font-bold text-white">Sign in to DataForge</h1>
            <p class="text-dfMuted text-xs font-light">
                Enterprise Infrastructure & AI Control Console
            </p>
        </div>

        <!-- Login Card Form -->
        <div class="glass-card rounded-3xl p-8 border border-dfBorder space-y-6">
            
            <!-- OAuth Provider Buttons -->
            <div class="space-y-3">
                <button onclick="alert('Authenticating securely with Google OAuth...');" class="w-full py-3 bg-dfSecondaryBg border border-dfBorder hover:border-dfPrimary rounded-xl text-xs font-semibold text-white transition-all flex items-center justify-center gap-3 group">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.6 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 15.6C3.5 19.4 7.4 23 12 23z"/></svg>
                    <span>Continue with Google</span>
                </button>

                <button onclick="alert('Authenticating securely with GitHub SSO...');" class="w-full py-3 bg-dfSecondaryBg border border-dfBorder hover:border-dfPrimary rounded-xl text-xs font-semibold text-white transition-all flex items-center justify-center gap-3 group">
                    <svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    <span>Continue with GitHub</span>
                </button>

                <button onclick="alert('Authenticating securely with Microsoft Enterprise Account...');" class="w-full py-3 bg-dfSecondaryBg border border-dfBorder hover:border-dfPrimary rounded-xl text-xs font-semibold text-white transition-all flex items-center justify-center gap-3 group">
                    <svg class="w-4 h-4" viewBox="0 0 23 23"><path fill="#f3f3f3" d="M0 0h11v11H0z"/><path fill="#f3f3f3" d="M12 0h11v11H12z"/><path fill="#f3f3f3" d="M0 12h11v11H0z"/><path fill="#f3f3f3" d="M12 12h11v11H12z"/></svg>
                    <span>Continue with Microsoft</span>
                </button>
            </div>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-dfBorder"></div>
                <span class="flex-shrink mx-4 text-xs font-mono text-dfMuted">OR WORK EMAIL</span>
                <div class="flex-grow border-t border-dfBorder"></div>
            </div>

            <form onsubmit="event.preventDefault(); alert('Authenticating via Enterprise credentials...');" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-dfMuted mb-2">Work Email / Organization Domain</label>
                    <input type="email" required placeholder="alex@enterprise.com" class="w-full px-4 py-3 rounded-xl bg-dfBg border border-dfBorder text-white text-sm focus:outline-none focus:border-dfPrimary transition-colors">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-mono text-dfMuted">Password</label>
                        <a href="#" class="text-xs text-dfPrimary hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" required placeholder="••••••••••••" class="w-full px-4 py-3 rounded-xl bg-dfBg border border-dfBorder text-white text-sm focus:outline-none focus:border-dfPrimary transition-colors">
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-dfPrimary to-dfSecondary text-dfBg font-bold rounded-xl text-xs hover:opacity-90 transition-all shadow-lg shadow-dfPrimary/20 flex items-center justify-center gap-2">
                    <span>Sign In to Console</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <div class="text-center text-xs text-dfMuted">
            Protected by SOC2 Type II compliance & end-to-end encryption. <br>
            <a href="privacy.html" class="text-white hover:underline mt-1 inline-block">Privacy Policy</a> • <a href="status.html" class="text-white hover:underline">System Status</a>
        </div>

    </div>

    <!-- Interactive Script -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
